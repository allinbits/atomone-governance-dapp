query ValSet($height: bigint!) {
  proposal_validator_status_snapshot: 
  validator_status(distinct_on: validator_address, order_by: [{validator_address: asc}, {height: desc_nulls_last}],  where: { height: { _lte: $height } }) {
    height
    jailed
    status
    validator_address
    validator_info {
      self_delegate_address
       validator_descriptions(
        where: { _or: [{ height: { _lte: $height } }, { height: { _is_null: true } }] }
        order_by: { height: desc_nulls_last }
        limit: 1
      ) {
        identity
        avatar_url
        details
        moniker
        website
      }
    }
  }
}
